# 跨平台构建：Linux AppImage + Windows 安装包（tag 或手动触发）
name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建与测试（测试失败不打包）
        # Ubuntu：npm test（build + 87 项断言，含 VCS/API 集成，依赖系统 svn）；
        # Windows：仅构建（TortoiseSVN 需手动勾选 command line client tools,裸机无 svn 命令）
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update && sudo apt-get install -y subversion
            npm test
          else
            npm run build
          fi

      - name: 打包 Linux AppImage
        if: runner.os == 'Linux'
        # 不覆盖 electronDist：用 npm ci 装好的 node_modules/electron/dist；
        # --publish never：发布统一交给后面的 release job（tag 上 electron-builder
        # 默认会自己往 GitHub 发，没有 GH_TOKEN 直接失败）
        run: npx electron-builder --linux AppImage --publish never

      - name: 打包 Windows 安装包与免安装版
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis portable --publish never

      - name: 打包 WSL 压缩包（纯 Node + 内置 Node）
        if: runner.os == 'Linux'
        # 两个包：wsl（目标机自备 Node 20.11+，约 4MB）、wsl-node（内置 Linux x64 Node，约 46MB）
        run: |
          npm run dist:wsl
          npm run dist:wsl-node

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: svngit-${{ runner.os }}
          # 只收最终产物：deploy/release/* 会把 linux-unpacked/win-unpacked 整个目录
          # 递归传上去（Release 里混进几十个 dll/pak 就是这么来的）
          path: |
            deploy/release/*.AppImage
            deploy/release/*.exe
            deploy/release/*.tar.gz
          if-no-files-found: error

  # 两个平台都构建完后统一发布：避免两个 job 并发抢建同一个 Release。
  # 只有推 v* 标签才建 Release；手动触发只出 Artifact。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 这里没有 checkout，gh 推断不出仓库，必须显式 --repo
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          find artifacts -type f -exec gh release upload "$GITHUB_REF_NAME" {} --repo "$GITHUB_REPOSITORY" --clobber \;
